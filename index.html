<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Behavior Tree Editor</title>

        <!-- Drawflow CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css"
        />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/drawflow.custom.css" />
    </head>
    <body>
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button
                    id="btn-sidebar-toggle"
                    class="btn-sidebar-toggle"
                    title="折叠/展开侧边栏"
                >☰</button>
                <h1 class="title">🌲 Behavior Tree Editor</h1>
            </div>
            <div class="header-right">
                <button
                    id="btn-replay-toggle"
                    class="btn btn-secondary"
                    title="日志回放面板"
                >
                    <span>📊</span> 回放
                </button>
                <button
                    id="btn-clear"
                    class="btn btn-secondary"
                    title="清空画布"
                >
                    <span>🗑️</span> 清空
                </button>
                <button
                    id="btn-import-nodes"
                    class="btn btn-secondary"
                    title="导入节点定义"
                >
                    <span>📥</span> 导入节点
                </button>
                <button
                    id="btn-import-tree"
                    class="btn btn-secondary"
                    title="导入行为树"
                >
                    <span>📂</span> 导入树
                </button>
                <button
                    id="btn-export"
                    class="btn btn-primary"
                    title="导出行为树"
                >
                    <span>💾</span> 导出
                </button>
            </div>
        </header>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Sidebar - Node Palette -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>节点面板</h2>
                </div>

                <div class="node-category">
                    <h3 class="category-title">🔀 组合节点 (Composite)</h3>
                    <div class="node-list" id="composite-nodes">
                        <!-- Composite nodes will be added here dynamically -->
                    </div>
                </div>

                <div class="node-category">
                    <h3 class="category-title">🎬 动作节点 (Action)</h3>
                    <div class="node-list" id="action-nodes">
                        <!-- Action nodes will be added here dynamically -->
                    </div>
                </div>

                <div class="node-category">
                    <h3 class="category-title">🎭 装饰器节点 (Decorator)</h3>
                    <div class="node-list" id="decorator-nodes">
                        <!-- Decorator nodes will be added here dynamically -->
                    </div>
                </div>

                <div class="sidebar-footer">
                    <button
                        id="btn-add-custom-node"
                        class="btn btn-block btn-secondary"
                    >
                        ➕ 添加自定义节点
                    </button>
                </div>
            </aside>

            <!-- Main Editor Area -->
            <main class="editor-container">
                <div class="editor-toolbar">
                    <div class="toolbar-group">
                        <button id="btn-zoom-in" class="btn-icon" title="放大">
                            🔍+
                        </button>
                        <button id="btn-zoom-out" class="btn-icon" title="缩小">
                            🔍-
                        </button>
                        <button
                            id="btn-zoom-reset"
                            class="btn-icon"
                            title="重置缩放"
                        >
                            ⚪
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <span class="toolbar-label">视图:</span>
                        <button
                            id="btn-center-view"
                            class="btn-icon"
                            title="居中视图"
                        >
                            🎯
                        </button>
                        <button
                            id="btn-fit-view"
                            class="btn-icon"
                            title="适应画布"
                        >
                            📐
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <span class="toolbar-label">布局:</span>
                        <button
                            id="btn-toggle-layout"
                            class="btn-icon"
                            title="切换布局方向（左右/上下）"
                        >
                            ⇄
                        </button>
                    </div>
                    <div class="toolbar-group toolbar-collapsible">
                        <span class="toolbar-label">子树操作:</span>
                        <button
                            id="btn-collapse-all"
                            class="btn-icon"
                            title="折叠所有子树"
                        >
                            🔽 全部折叠
                        </button>
                        <button
                            id="btn-expand-all"
                            class="btn-icon"
                            title="展开所有子树"
                        >
                            🔼 全部展开
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <span class="toolbar-label" id="node-count"
                            >节点: 0</span
                        >
                    </div>
                    <div class="toolbar-group" style="margin-left: auto">
                        <span
                            class="toolbar-label"
                            style="font-size: 11px; color: #808080"
                            >💡 按住右键或空格键拖动画布</span
                        >
                    </div>
                    <!-- Toolbar overflow for small screens -->
                    <div class="toolbar-more">
                        <button class="toolbar-more-btn" id="btn-toolbar-more" title="更多操作">⋯</button>
                        <div class="toolbar-more-dropdown" id="toolbar-more-dropdown">
                            <div class="toolbar-group">
                                <span class="toolbar-label">子树操作:</span>
                                <button
                                    id="btn-collapse-all-2"
                                    class="btn-icon"
                                    title="折叠所有子树"
                                >🔽 折叠</button>
                                <button
                                    id="btn-expand-all-2"
                                    class="btn-icon"
                                    title="展开所有子树"
                                >🔼 展开</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Drawflow Canvas -->
                <div id="drawflow" class="drawflow-container" tabindex="0">
                    <div class="drawflow-hint">
                        <p>👈 从左侧拖拽节点到画布开始构建行为树</p>
                        <p>🖱️ 画布移动: 右键拖动 或 按住空格键+左键拖动</p>
                        <p>💡 提示: 缩放用鼠标滚轮</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- Replay Panel (Right Drawer) -->
        <div id="replay-panel" class="replay-panel collapsed">
            <div class="replay-panel-header">
                <h3>📊 日志回放</h3>
                <button id="btn-close-replay" class="btn-icon" title="关闭回放面板">✕</button>
            </div>
            <div class="replay-panel-body">
                <!-- File loading -->
                <div class="replay-section">
                    <label class="replay-label">加载日志:</label>
                    <div class="replay-file-row">
                        <input type="file" id="replay-file-input" accept=".jsonl" />
                        <button id="btn-load-example" class="btn btn-secondary btn-sm">加载示例</button>
                    </div>
                </div>
                <!-- WS Connect -->
                <div class="replay-section">
                    <label class="replay-label">WebSocket:</label>
                    <div class="replay-ws-row">
                        <input type="text" id="ws-url" value="ws://localhost:3001" placeholder="ws://host:port" />
                        <button id="btn-ws-connect" class="btn btn-secondary btn-sm">连接</button>
                        <span id="ws-status" class="ws-status disconnected">● 未连接</span>
                    </div>
                </div>
                <!-- Playback controls -->
                <div class="replay-section replay-controls">
                    <button id="btn-replay-stop" class="btn-icon" title="停止">⏹</button>
                    <button id="btn-replay-step-back" class="btn-icon" title="上一步">⏮</button>
                    <button id="btn-replay-play" class="btn-icon btn-play" title="播放/暂停">▶</button>
                    <button id="btn-replay-step-fwd" class="btn-icon" title="下一步">⏭</button>
                    <input type="range" id="tick-slider" min="0" max="0" value="0" class="tick-slider" />
                    <span id="tick-label" class="tick-label">Tick: 0/0</span>
                    <select id="speed-select" class="speed-select">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="2">2x</option>
                        <option value="5">5x</option>
                        <option value="10">10x</option>
                    </select>
                </div>
                <!-- Info display -->
                <div class="replay-section replay-info">
                    <span id="replay-tick-info">就绪 - 请加载日志文件</span>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left">
                <span id="status-message">就绪</span>
                <span id="status-stats" class="status-stats">节点: 0 | 连接: 0</span>
            </div>
            <div class="status-right">
                <span id="cursor-position">X: 0, Y: 0</span>
            </div>
        </footer>

        <!-- Modal for Custom Node -->
        <div id="custom-node-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>添加自定义节点</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="node-name">节点名称:</label>
                        <input
                            type="text"
                            id="node-name"
                            placeholder="例如: MyCustomAction"
                        />
                    </div>
                    <div class="form-group">
                        <label for="node-type">节点类型:</label>
                        <select id="node-type">
                            <option value="0">组合节点 (Composite)</option>
                            <option value="1">动作节点 (Action)</option>
                            <option value="2">装饰器节点 (Decorator)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="node-ports"
                            >端口配置 (JSON格式，可选):</label
                        >
                        <textarea
                            id="node-ports"
                            rows="4"
                            placeholder='[{"name": "delay", "type_name": "int", "mode": 0}]'
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="btn-cancel-node" class="btn btn-secondary">
                        取消
                    </button>
                    <button id="btn-save-node" class="btn btn-primary">
                        保存
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal for Import Nodes -->
        <div id="import-nodes-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>导入节点定义</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="nodes-json">粘贴节点JSON:</label>
                        <textarea
                            id="nodes-json"
                            rows="15"
                            placeholder='{"nodes": [...]}'
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        id="btn-cancel-import-nodes"
                        class="btn btn-secondary"
                    >
                        取消
                    </button>
                    <button
                        id="btn-confirm-import-nodes"
                        class="btn btn-primary"
                    >
                        导入
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal for Import Tree -->
        <div id="import-tree-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>导入行为树</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="tree-json">粘贴行为树JSON:</label>
                        <textarea
                            id="tree-json"
                            rows="15"
                            placeholder='{"root": {...}}'
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        id="btn-cancel-import-tree"
                        class="btn btn-secondary"
                    >
                        取消
                    </button>
                    <button
                        id="btn-confirm-import-tree"
                        class="btn btn-primary"
                    >
                        导入
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal for Export -->
        <div id="export-modal" class="modal">
            <div class="modal-content modal-large">
                <div class="modal-header">
                    <h2>导出行为树</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>行为树结构:</label>
                        <textarea
                            id="export-tree-json"
                            rows="15"
                            readonly
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="btn-copy-tree" class="btn btn-secondary">
                        复制树结构
                    </button>
                    <button id="btn-download-json" class="btn btn-primary">
                        下载JSON文件
                    </button>
                    <button id="btn-close-export" class="btn btn-secondary">
                        关闭
                    </button>
                </div>
            </div>
        </div>

        <!-- Hidden file inputs -->
        <input
            type="file"
            id="file-input"
            accept=".json"
            style="display: none"
        />

        <!-- Drawflow Library -->
        <script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>

        <!-- Application Scripts (load order matters) -->
        <!-- 1. Dependencies: nodeTemplates → behaviorTree → editor → logPlayer → wsViewer -->
        <script src="js/nodeTemplates.js"></script>
        <script src="js/behaviorTree.js"></script>
        <script src="js/editor.js"></script>
        <script src="js/logPlayer.js"></script>
        <script src="js/wsViewer.js"></script>
        <!-- 2. App namespace (must load before UI modules) -->
        <script src="js/app.js"></script>
        <!-- 3. UI modules -->
        <script src="js/ui/canvas.js"></script>
        <script src="js/ui/keyboard.js"></script>
        <script src="js/ui/replay.js"></script>
        <script src="js/ui/panels.js"></script>
        <!-- 4. Main entry (orchestrates initialization) -->
        <script src="js/main.js"></script>
    </body>
</html>
